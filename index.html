    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        #culture-card {
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 16px;
            width: 90%;
            max-width: 500px;
            min-height: 200px;
            padding: 40px 30px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            background: rgba(255, 255, 255, 0.95);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            backdrop-filter: blur(10px);
            margin-bottom: 30px;
            word-wrap: break-word;
            overflow-wrap: break-word;
        }

        #culture-card::before {
            content: "Culture of the Day";
            font-size: 0.85rem;
            font-weight: 600;
            color: #666;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 20px;
        }

        #culture-card {
            font-size: 2rem;
            font-weight: 700;
            color: #333;
            line-height: 1.4;
        }

        #wheel {
            border-radius: 100%;
            height: 100px;
            width: 100px;
            border: 3px solid rgba(255, 255, 255, 0.8);
            display: flex;
            justify-content: center;
            align-items: center;
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
            color: white;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            text-align: center;
        }

        #wheel:hover {
            transform: scale(1.1);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
        }

        footer {
            position: absolute;
            bottom: 0;
            color: #fff;
        }

        a {
            color: #fff;
            transition: font-size 0.2s ease;
        }

        a:hover {
            font-size: 1.2rem;
        }
    </style>
  </head>
